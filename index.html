      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');

          root.innerHTML = '<div style="padding:40px;background:#1a0000;color:#ff4444;font-family:monospace;white-space:pre-wrap;max-width:800px;margin:40px auto;border-radius:8px;border:1px solid #ff4444;"><h2 style="color:#ff6666;margin-bottom:16px;">JavaScript Error</h2><p>' + (e.message || 'Unknown error') + '</p></div>';

      });
