  <body>
    <div id="root"><!--CONTENT-START-->
      <div id="loading-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f7f1;color:#242520;font-family:Inter,system-ui,sans-serif;flex-direction:column;gap:16px;">
        <div style="width:48px;height:48px;border:3px solid #d8d9d2;border-top-color:#ff541d;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <p style="font-size:14px;opacity:0.7;">Loading Chronolyte...</p>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    <!--CONTENT-END--></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          var panel = document.createElement('main');
          var title = document.createElement('h1');
          var message = document.createElement('p');
          title.textContent = 'JavaScript Error';
          message.textContent = e.message || 'Unknown error';
          panel.append(title, message);
          root.append(panel);
        }
      });
    </script>
