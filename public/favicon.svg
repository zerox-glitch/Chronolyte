<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)" stroke="url(#cyan)" stroke-width="1"/>
  <!-- Hourglass shape -->
  <g filter="url(#glow)">
    <!-- Top triangle -->
    <path d="M10 8 L22 8 L16 15 Z" fill="none" stroke="url(#cyan)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom triangle -->
    <path d="M10 24 L22 24 L16 17 Z" fill="none" stroke="url(#cyan)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sand falling -->
    <circle cx="16" cy="16" r="1" fill="#00e5ff"/>
    <!-- Top sand -->
    <path d="M13 10 L19 10 L16 13 Z" fill="#00e5ff" opacity="0.6"/>
    <!-- Bottom sand -->
    <path d="M14 21 L18 21 L16 18 Z" fill="#00e5ff" opacity="0.8"/>
  </g>
</svg>